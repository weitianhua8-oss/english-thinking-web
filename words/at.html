<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>AT｜英语思维完整导图</title><link rel="stylesheet" href="../assets/mindmap.css?v=20260814-xmind1"></head><body><div class="top"><div class="title">AT｜英语思维完整导图</div><div class="sub">核心画面：🎯 把目标锁定成一个点</div><div class="tools"><button id="fit">适应画布</button><button id="reset">重置</button></div></div><div id="vp" class="viewport"><div id="cv" class="canvas"><div id="root" class="root">AT（英语思维完整导图）<small>🎯 点定位 / 点锁定</small></div></div><a class="back" href="../index.html">← 返回单词目录</a><div class="hint">单指拖动 · 双指缩放 · 鼠标滚轮缩放 · XMind 曲线版</div></div><script src="../assets/mindmap.js?v=20260814-xmind1"></script><script>initMindMap({branches:[{title:'01 一句话抓住本源',color:'c1',light:'n1',items:['AT = 把人、物、时间或动作目标锁定成一个点。','核心图式：────────→ 🎯','重点不是“小地方”，而是“点式定位”。']},{title:'02 核心画面',color:'c2',light:'n2',items:['地图上一个点 🎯','时间轴上的一个点 ⏱️','注意力锁定一个目标 👀 → 🎯']},{title:'03 底层英语思维',color:'c3',light:'n3',items:['英语用 AT 把复杂场景压缩成“一个可锁定的位置”。','空间、时间、动作目标都能共享“点定位”模型。','AT 是学习模型，不等于它的字源解释。']},{title:'04 意义如何生长',color:'c4',light:'n4',items:['空间点 → at the door','时间点 → at 7 o’clock','目标点 → look at me','能力 / 行为目标 → good at math','活动场景点 → at work / at school']},{title:'05 核心使用场景',color:'c5',light:'n5',items:['Meet me at the station. → 把车站当会合点','The class starts at 8. → 时间轴锁定 8 点','Look at me. → 视线锁定 me','She is good at English. → 能力落在 English 这个目标点']},{title:'06 高频结构',color:'c6',light:'n6',items:['at + 地点 → 点式定位','at + 精确时间 → 时间点','look / stare / smile + at → 行为指向目标','good / bad + at → 能力落在某项活动','at work / at school / at home → 场景状态']},{title:'07 易混词对比',color:'c7',light:'n7',items:['AT = 🎯 点','IN = 📦 范围 / 内部','ON = ▬ 接触 / 附着 / 平台','TO = → 朝目标移动','不要用“地方大小”机械区分 AT 和 IN。']},{title:'08 英语思维避坑',color:'c8',light:'n8',items:['❌ AT = 小地方','✅ AT = 把场景当作一个点来定位','同一个地点可以因视角不同使用 AT 或 IN。','先判断说话人采用什么“镜头”。']},{title:'09 代表例句',color:'c9',light:'n9',items:['I am at the door.','Meet me at 6.','Look at the picture.','He is good at chess.','She is at work.']},{title:'10 记忆钩子 + 知识网络',color:'c10',light:'n10',items:['AT = 🎯','TO → 朝目标；AT → 锁定目标','IN → 范围内部；AT → 把范围压成点','ON → 接触关系；AT → 点定位关系']} ]});</script></body></html>
