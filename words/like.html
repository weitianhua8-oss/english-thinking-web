<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>LIKE｜英语思维完整导图</title><link rel="stylesheet" href="../assets/mindmap.css?v=20260814-xmind1"></head><body><div class="top"><div class="title">LIKE｜英语思维完整导图</div><div class="sub">两个核心系统：喜欢 / 相似</div><div class="tools"><button id="fit">适应画布</button><button id="reset">重置</button></div></div><div id="vp" class="viewport"><div id="cv" class="canvas"><div id="root" class="root">LIKE（英语思维完整导图）<small>😊 喜欢 ｜ ≈ 相似</small></div></div><a class="back" href="../index.html">← 返回单词目录</a><div class="hint">单指拖动 · 双指缩放 · 鼠标滚轮缩放 · XMind 曲线版</div></div><script src="../assets/mindmap.js?v=20260814-xmind1"></script><script>initMindMap({branches:[{title:'01 先分清两个 LIKE',color:'c1',light:'n1',items:['动词 LIKE：某事物对我的胃口 / 我对它有正向偏好。','相似 LIKE：A ≈ B，表示“像……一样 / 类似”。','这两套功能不要硬塞成一个语法模型。']},{title:'02 核心画面',color:'c2',light:'n2',items:['喜欢：对象 → 我 😊','相似：A ≈ B','先判断句子里的 LIKE 是动词还是“相似关系”。']},{title:'03 底层英语思维',color:'c3',light:'n3',items:['喜欢义关注“我对对象的正向感受”。','相似义关注“两个事物之间的相似关系”。','中文都可能翻成不同词，但英语结构要先分系统。']},{title:'04 喜欢义如何生长',color:'c4',light:'n4',items:['like + 名词 → I like coffee.','like + doing → I like reading.','like + to do → I like to walk after dinner.','would like → 更柔和地表达想要 / 意愿']},{title:'05 相似义如何生长',color:'c5',light:'n5',items:['look like → 看起来像','sound like → 听起来像','be like → 像 / 是什么样','What is she like? → 她是怎样的人？']},{title:'06 高频结构',color:'c6',light:'n6',items:['like + noun','like + doing','like + to do','would like + noun / to do','look / sound / feel + like','What ... like?']},{title:'07 易混对比',color:'c7',light:'n7',items:['LIKE doing → 更容易把活动本身当作喜欢的对象','LIKE to do → 常把动作当作选择 / 习惯表达','WOULD LIKE → 柔和意愿，不等于普通 LIKE','LIKE（喜欢）≠ LIKE（相似）']},{title:'08 英语思维避坑',color:'c8',light:'n8',items:['❌ 所有 LIKE 都翻译成“喜欢”','✅ 先判断：偏好系统还是相似系统','❌ 强行把相似义也解释成“喜欢”','✅ 两种功能分别建立清晰模型']},{title:'09 代表例句',color:'c9',light:'n9',items:['I like dogs.','I like reading.','I would like some tea.','She looks like her mother.','What is your teacher like?']},{title:'10 记忆钩子 + 知识网络',color:'c10',light:'n10',items:['LIKE① = 😊 正向偏好','LIKE② = ≈ 相似关系','WOULD + LIKE → 柔化意愿','LOOK / SOUND + LIKE → 感知结果与相似关系结合']} ]});</script></body></html>
