<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>ON｜英语思维完整导图</title><link rel="stylesheet" href="../assets/mindmap.css"></head><body><div class="top"><div class="title">ON｜英语思维完整导图</div><div class="sub">核心画面：接触 / 附着 / 承载 / 连接状态</div><div class="tools"><button id="fit">适应画布</button><button id="reset">重置</button></div></div><div id="vp" class="viewport"><div id="cv" class="canvas"><div id="root" class="root">ON（英语思维完整导图）<small>▬ 接触并保持连接</small></div></div><a class="back" href="../index.html">← 返回单词目录</a><div class="hint">单指拖动 · 双指缩放 · 鼠标滚轮缩放</div></div><script src="../assets/mindmap.js"></script><script>initMindMap({branches:[{title:'01 一句话抓住本源',color:'c1',light:'n1',items:['ON = A 和 B 建立接触、附着、承载或连接关系。','核心不是“在……上面”这一个中文意思。','看到 ON，先找：什么东西和什么东西接上了？']},{title:'02 核心画面',color:'c2',light:'n2',items:['物体贴在表面：📄 ON table','设备接通：power ON','信息承载在平台：on TV / on the internet']},{title:'03 底层英语思维',color:'c3',light:'n3',items:['从物理接触自然长到抽象连接。','ON 可以表达“处在运转 / 接通状态”。','时间表达可先作为稳定用法掌握，不必硬套成物理表面。']},{title:'04 意义如何生长',color:'c4',light:'n4',items:['表面接触 → on the table','附着 → a picture on the wall','承载 / 平台 → on TV / on the phone','连接 / 运转 → the light is on','时间节点中的日期类表达 → on Monday']},{title:'05 核心使用场景',color:'c5',light:'n5',items:['The book is on the desk. → 接触并被桌面承载','There is a picture on the wall. → 附着','I saw it on TV. → 信息出现在媒介平台','The computer is on. → 设备处在接通状态']},{title:'06 高频结构',color:'c6',light:'n6',items:['on + surface','on + platform / medium','be on → 接通 / 进行中','turn on → 让设备进入接通状态','on + day/date → 固定时间表达']},{title:'07 易混词对比',color:'c7',light:'n7',items:['ON = ▬ 接触 / 承载','IN = 📦 内部 / 包含','AT = 🎯 点定位','OFF = 分离 / 断开','ON ↔ OFF 是非常重要的一组状态对比。']},{title:'08 英语思维避坑',color:'c8',light:'n8',items:['❌ ON = 在……上面','✅ 更稳定模型：接触 / 附着 / 承载 / 连接','不是所有 ON 都有真实物理表面。','平台、设备状态等是抽象延伸。']},{title:'09 代表例句',color:'c9',light:'n9',items:['The cup is on the table.','The picture is on the wall.','I am on the phone.','The light is on.','See you on Monday.']},{title:'10 记忆钩子 + 知识网络',color:'c10',light:'n10',items:['ON = 接上了','ON ↔ OFF：连接 ↔ 分离','IN = 包进去；ON = 接上去','AT = 定位成点；ON = 建立接触关系']} ]});</script></body></html>
