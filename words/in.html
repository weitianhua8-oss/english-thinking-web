<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>IN｜英语思维完整导图</title><link rel="stylesheet" href="../assets/mindmap.css"></head><body><div class="top"><div class="title">IN｜英语思维完整导图</div><div class="sub">核心画面：进入一个边界、范围、系统或状态内部</div><div class="tools"><button id="fit">适应画布</button><button id="reset">重置</button></div></div><div id="vp" class="viewport"><div id="cv" class="canvas"><div id="root" class="root">IN（英语思维完整导图）<small>📦 在边界 / 范围内部</small></div></div><a class="back" href="../index.html">← 返回单词目录</a><div class="hint">单指拖动 · 双指缩放 · 鼠标滚轮缩放</div></div><script src="../assets/mindmap.js"></script><script>initMindMap({branches:[{title:'01 一句话抓住本源',color:'c1',light:'n1',items:['IN = 把某物放进一个“范围内部”来看。','这个范围可以是空间、时间、系统、状态。','核心不是“静止”，而是“内部关系”。']},{title:'02 核心画面',color:'c2',light:'n2',items:['📦 边界外 → [ 内部 ]','城市 / 国家也可以被当成范围','状态也能像容器：in trouble / in love']},{title:'03 底层英语思维',color:'c3',light:'n3',items:['英语常把抽象概念空间化。','只要说话人把某件事看成有边界的范围，就能用 IN。','动作是否移动，通常由动词决定，不由 IN 单独决定。']},{title:'04 意义如何生长',color:'c4',light:'n4',items:['空间内部 → in the room','大范围 → in China','时间范围 → in 2026 / in summer','系统内部 → in the team','状态内部 → in trouble / in love']},{title:'05 核心使用场景',color:'c5',light:'n5',items:['The keys are in the box. → 箱子内部','She lives in Beijing. → 城市范围内部','I was born in 1993. → 年份范围内部','He is in trouble. → 进入“麻烦”状态范围']},{title:'06 高频结构',color:'c6',light:'n6',items:['in + 空间 / 地区','in + 年 / 月 / 季节 / 较大时间范围','in + 状态名词','put ... in ... → 动词表达移动，IN 标记最终内部关系','be in → 处在某范围 / 状态内部']},{title:'07 易混词对比',color:'c7',light:'n7',items:['IN = 📦 内部 / 范围','INTO = → 穿过边界进入内部','AT = 🎯 点定位','ON = ▬ 接触 / 承载关系','不要把 IN 简化成“大地方”。']},{title:'08 英语思维避坑',color:'c8',light:'n8',items:['❌ IN = 静态','✅ IN = 内部关系；移动与否看整个句子','❌ IN 只用于物理容器','✅ 抽象状态、时间、系统都能被概念化成范围']},{title:'09 代表例句',color:'c9',light:'n9',items:['She is in the room.','I live in Nanning.','We met in July.','He is in danger.','Put the book in the bag.']},{title:'10 记忆钩子 + 知识网络',color:'c10',light:'n10',items:['IN = 📦 内部范围','IN + TO → INTO','AT = 点；IN = 范围','ON = 接触；IN = 包含']} ]});</script></body></html>
