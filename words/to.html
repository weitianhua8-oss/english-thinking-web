<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>TO｜英语思维完整导图</title><link rel="stylesheet" href="../assets/mindmap.css?v=20260814-2"></head><body><div class="top"><div class="title">TO｜英语思维完整导图</div><div class="sub">单指拖动 · 双指缩放 · 鼠标拖动 / 滚轮缩放</div><div class="tools"><button id="fit">适应画布</button><button id="reset">重置</button></div></div><div id="vp" class="viewport"><div id="cv" class="canvas"><div id="root" class="root">TO（英语思维完整导图）<small>→ 朝目标伸出去的一支箭头</small></div></div><a class="back" href="../index.html">← 返回单词目录</a><div class="hint">手机建议横屏查看 · 连接线兼容版</div></div><script src="../assets/mindmap.js?v=20260814-2"></script><script>initMindMap({branches:[{title:'01 一句话抓住本源',color:'c1',light:'n1',items:['TO = 从当前位置朝一个目标指过去。','核心图式：● ─────→ 🎯','不要先背“到 / 向 / 给 / 去”这些中文意思。']},{title:'02 核心画面',color:'c2',light:'n2',items:['起点 ● ─────────→ 🎯 目标','TO 就是一支“朝目标伸出去”的箭头。','看到 TO，先问：箭头指向哪里？']},{title:'03 底层英语思维',color:'c3',light:'n3',items:['英语不是先选中文翻译，而是在组织关系 / 方向 / 状态 / 视角。','先抓画面，再让具体中文意思从场景里长出来。','新用法如果还能从核心画面解释，就挂到同一棵意义树。','如果解释不通，不要强行套模型。']},{title:'04 意义如何生长',color:'c4',light:'n4',items:['空间目标 → go to school','接收目标 → give it to me','注意目标 → listen to me','动作目标 → want to go','结果目标 → lead to success','时间目标 → ten to five']},{title:'05 核心使用场景',color:'c5',light:'n5',items:['I go to school. → 移动 → school','Give the book to him. → book → him','Listen to me. → 听觉注意力 → me','I want to eat. → want → eat 这个动作目标','Smoking can lead to disease. → 原因路径 → 结果']},{title:'06 高频结构 / 固定搭配',color:'c6',light:'n6',items:['go / come + to + 地点 → 移动 → 目标','give / send / show + to + 人 → 信息 / 物体 → 接收目标','listen / talk + to + 人 / 物 → 注意或沟通 → 目标','want / plan / need + to do → 当前状态 → 动作目标','lead to / come to → 路径 → 结果','学习原则：先理解核心画面，再整体记住高频组合']},{title:'07 易混词对比',color:'c7',light:'n7',items:['TO：● ─────→ 🚪 → 朝目标','INTO：● ─→ |边界| → 📦 → 进入内部','AT：● ─────→ 🎯 → 锁定成点','to do → 指向动作目标','doing → 把动作本身打开来看']},{title:'08 英语思维避坑',color:'c8',light:'n8',items:['❌ to = 到 / 向 / 给 / 去：这些只是中文翻译结果','✅ 更稳定的底层模型：目标指向','⚠️ 介词 to 与不定式 to 的语法身份不同','不要把所有 to 强行当成同一个语法结构']},{title:'09 代表例句',color:'c9',light:'n9',items:['I go to school.','Give the book to him.','Listen to me.','I want to eat.','Smoking can lead to disease.','复习：先套核心图式，再确认中文意思']},{title:'10 记忆钩子 + 知识网络',color:'c10',light:'n10',items:['TO = → 目标箭头','FROM = 起点 → TO = 终点','IN + TO → INTO','TOO + TO → 程度越界后目标受阻']} ]});</script></body></html>
