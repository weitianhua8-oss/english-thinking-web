<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>TO｜英语思维完整导图</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f7f7f7;color:#283446}.top{height:84px;padding:12px 14px;background:rgba(255,255,255,.96);border-bottom:1px solid #e8e8e8}.title{font-size:18px;font-weight:800}.sub{font-size:11px;color:#7d8798;margin-top:3px}.tools{margin-top:7px;display:flex;gap:6px}.tools button{border:1px solid #ddd;background:#fff;border-radius:9px;padding:6px 10px;font-size:11px}.viewport{position:relative;height:calc(100vh - 84px);overflow:hidden;touch-action:none;overscroll-behavior:none;cursor:grab;user-select:none}.viewport.drag{cursor:grabbing}.canvas{position:absolute;left:0;top:0;width:1360px;transform-origin:0 0;will-change:transform}.root{position:absolute;left:40px;top:1040px;width:260px;padding:22px 12px;border-radius:12px;background:#111;color:#fff;text-align:center;font-weight:800}.root small{display:block;margin-top:5px;color:#ccc;font-weight:500}.branch,.node{position:absolute;border-radius:8px;padding:9px 12px;line-height:1.25}.branch{width:250px;font-weight:800}.node{width:280px;font-size:12px}.c1{background:#ff6b6b}.c2{background:#f6a15c}.c3{background:#7dc8a8}.c4{background:#6ad0c7}.c5{background:#67b7e8}.c6{background:#c97ae6}.c7{background:#ff6f6f}.c8{background:#f39a57}.c9{background:#86c5a5}.c10{background:#67d1c7}.n1{background:#ffe4e4}.n2{background:#fdf0e3}.n3{background:#e8f6ef}.n4{background:#e4f7f5}.n5{background:#e4f2fb}.n6{background:#f6e8fb}.n7{background:#ffe4e4}.n8{background:#fdebe0}.n9{background:#e9f5ef}.n10{background:#e4f7f5}.line{position:absolute;height:2px;transform-origin:left center;opacity:.85}.hint{position:absolute;right:12px;bottom:10px;background:rgba(255,255,255,.9);border:1px solid #e6e6e6;border-radius:10px;padding:7px 9px;font-size:10px;color:#808899}</style></head><body><div class="top"><div class="title">TO｜英语思维完整导图</div><div class="sub">单指拖动 · 双指缩放 · 鼠标拖动 / 滚轮缩放</div><div class="tools"><button id="fit">适应画布</button><button id="reset">重置</button></div></div><div id="vp" class="viewport"><div id="cv" class="canvas"><div class="root">TO（英语思维完整导图）<small>→ 朝目标伸出去的一支箭头</small></div></div><div class="hint">手机建议横屏查看</div></div><script>const data=[['01 一句话抓住本源','c1','n1',['TO = 从当前位置朝一个目标指过去。','核心图式：● ─────→ 🎯','不要先背“到 / 向 / 给 / 去”这些中文意思。']],['02 核心画面','c2','n2',['起点 ● ─────────→ 🎯 目标','TO 就是一支“朝目标伸出去”的箭头。','看到 TO，先问：箭头指向哪里？']],['03 底层英语思维','c3','n3',['英语不是先选中文翻译，而是在组织关系 / 方向 / 状态 / 视角。','先抓画面，再让具体中文意思从场景里长出来。','新用法如果还能从核心画面解释，就挂到同一棵意义树。','如果解释不通，不要强行套模型。']],['04 意义如何生长','c4','n4',['空间目标 → go to school','接收目标 → give it to me','注意目标 → listen to me','动作目标 → want to go','结果目标 → lead to success','时间目标 → ten to five']],['05 核心使用场景','c5','n5',['I go to school. → 移动 → school','Give the book to him. → book → him','Listen to me. → 听觉注意力 → me','I want to eat. → want → eat 这个动作目标','Smoking can lead to disease. → 原因路径 → 结果']],['06 高频结构 / 固定搭配','c6','n6',['go / come + to + 地点 → 移动 → 目标','give / send / show + to + 人 → 信息 / 物体 → 接收目标','listen / talk + to + 人 / 物 → 注意或沟通 → 目标','want / plan / need + to do → 当前状态 → 动作目标','lead to / come to → 路径 → 结果','学习原则：先理解核心画面，再整体记住高频组合']],['07 易混词对比','c7','n7',['TO：● ─────→ 🚪 → 朝目标','INTO：● ─→ |边界| → 📦 → 进入内部','AT：● ─────→ 🎯 → 锁定成点','to do → 指向动作目标','doing → 把动作本身打开来看']],['08 英语思维避坑','c8','n8',['❌ to = 到 / 向 / 给 / 去：这些只是中文翻译结果','✅ 更稳定的底层模型：目标指向','⚠️ 介词 to 与不定式 to 的语法身份不同','不要把所有 to 强行当成同一个语法结构']],['09 代表例句','c9','n9',['I go to school.','Give the book to him.','Listen to me.','I want to eat.','Smoking can lead to disease.','复习：先套核心图式，再确认中文意思']],['10 记忆钩子 + 知识网络','c10','n10',['TO = → 目标箭头','FROM = 起点 → TO = 终点','IN + TO → INTO','TOO + TO → 程度越界后目标受阻']]];const cv=document.getElementById('cv');let y=30;data.forEach((b,i)=>{const [t,bc,nc,arr]=b;const by=y+(arr.length*42)/2-18;const be=document.createElement('div');be.className='branch '+bc;be.style.cssText=`left:360px;top:${by}px`;be.textContent=t;cv.appendChild(be);arr.forEach((s,j)=>{const n=document.createElement('div');n.className='node '+nc;n.style.cssText=`left:660px;top:${y+j*42}px`;n.textContent=s;cv.appendChild(n)});y+=arr.length*42+24});cv.style.height=(y+40)+'px';const vp=document.getElementById('vp');let scale=.65,tx=14,ty=14,p=new Map(),g=null;const min=.25,max=2.5,cl=(v,a,b)=>Math.max(a,Math.min(b,v));function render(){cv.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}function fit(){const r=vp.getBoundingClientRect(),h=parseFloat(cv.style.height)||2200;scale=cl(Math.min((r.width-20)/1000,(r.height-20)/h),min,1);tx=Math.max(10,(r.width-1000*scale)/2);ty=Math.max(10,(r.height-h*scale)/2);render()}function reset(){scale=.65;tx=14;ty=14;render()}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}vp.onpointerdown=e=>{e.preventDefault();p.set(e.pointerId,{x:e.clientX,y:e.clientY});try{vp.setPointerCapture(e.pointerId)}catch(_){ }vp.classList.add('drag');if(p.size===1)g={type:'pan',x:e.clientX,y:e.clientY,tx,ty};else if(p.size===2){const a=[...p.values()],m=mid(a[0],a[1]);g={type:'pinch',d:dist(a[0],a[1]),s:scale,ax:(m.x-tx)/scale,ay:(m.y-ty)/scale}}};vp.onpointermove=e=>{if(!p.has(e.pointerId))return;e.preventDefault();p.set(e.pointerId,{x:e.clientX,y:e.clientY});if(p.size===1&&g?.type==='pan'){const a=[...p.values()][0];tx=g.tx+a.x-g.x;ty=g.ty+a.y-g.y;render()}else if(p.size>=2){const a=[...p.values()],m=mid(a[0],a[1]);if(g?.type!=='pinch')g={type:'pinch',d:dist(a[0],a[1]),s:scale,ax:(m.x-tx)/scale,ay:(m.y-ty)/scale};scale=cl(g.s*dist(a[0],a[1])/g.d,min,max);tx=m.x-g.ax*scale;ty=m.y-g.ay*scale;render()}};function end(e){p.delete(e.pointerId);if(!p.size){g=null;vp.classList.remove('drag')}else if(p.size===1){const a=[...p.values()][0];g={type:'pan',x:a.x,y:a.y,tx,ty}}}vp.onpointerup=end;vp.onpointercancel=end;vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,ax=(mx-tx)/scale,ay=(my-ty)/scale,n=cl(scale*(e.deltaY<0?1.12:.89),min,max);tx=mx-ax*n;ty=my-ay*n;scale=n;render()},{passive:false});document.getElementById('fit').onclick=fit;document.getElementById('reset').onclick=reset;requestAnimationFrame(()=>{innerWidth<700?render():fit()});</script></body></html>
