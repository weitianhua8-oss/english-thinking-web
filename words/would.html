<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>WOULD｜英语思维完整导图</title><link rel="stylesheet" href="../assets/mindmap.css"></head><body><div class="top"><div class="title">WOULD｜英语思维完整导图</div><div class="sub">核心画面：先退后一步，再从“较远的世界”看动作 / 意愿 / 结果</div><div class="tools"><button id="fit">适应画布</button><button id="reset">重置</button></div></div><div id="vp" class="viewport"><div id="cv" class="canvas"><div id="root" class="root">WOULD（英语思维完整导图）<small>↘→ 距离感视角</small></div></div><a class="back" href="../index.html">← 返回单词目录</a><div class="hint">单指拖动 · 双指缩放 · 鼠标滚轮缩放</div></div><script src="../assets/mindmap.js"></script><script>initMindMap({branches:[{title:'01 一句话抓住本源',color:'c1',light:'n1',items:['WOULD = 把现实往后退一步，再从“较远的位置”看动作、意愿或结果。','这个距离可以是时间距离、假设距离、社交距离。','不要只背成“will 的过去式”。']},{title:'02 核心画面',color:'c2',light:'n2',items:['WILL：现在直接向前 →','WOULD：先退一步 ↘ 再向前 →','距离变远，语气往往也更柔和 / 更不确定。']},{title:'03 底层英语思维',color:'c3',light:'n3',items:['英语常用“距离感”表达非现实、礼貌、过去视角。','WOULD 的不同用法并不是毫无关联。','共同点：说话人不从最直接的现实位置发出动作。']},{title:'04 意义如何生长',color:'c4',light:'n4',items:['过去视角中的未来 → He said he would go.','假设结果 → I would travel more.','礼貌请求 → Would you help me?','柔化意愿 → I would like...','过去反复习惯 → We would play outside.']},{title:'05 核心使用场景',color:'c5',light:'n5',items:['He said he would come. → 站在过去看未来','If I had time, I would travel. → 假设世界里的结果','Would you open the door? → 拉开社交距离，更礼貌','I would like some coffee. → 柔化“想要”']},{title:'06 高频结构',color:'c6',light:'n6',items:['would + 动词原形','would like + 名词 / to do','Would you + 动词...?','If ... , would ...','said / thought + would ... → 过去视角里的未来']},{title:'07 易混词对比',color:'c7',light:'n7',items:['WILL = 直接现实地向前','WOULD = 带距离地向前','WANT = 直接表达想要','WOULD LIKE = 更柔和地表达意愿','过去形式不一定等于“过去时间”。']},{title:'08 英语思维避坑',color:'c8',light:'n8',items:['❌ WOULD = WILL 的过去式，就结束了','✅ 时间、假设、礼貌都能用“距离感”理解','不同语法环境仍要分别掌握。','核心模型帮助理解，不代替具体句法。']},{title:'09 代表例句',color:'c9',light:'n9',items:['He said he would call me.','I would go if I had time.','Would you help me?','I would like a glass of water.','When we were kids, we would play here.']},{title:'10 记忆钩子 + 知识网络',color:'c10',light:'n10',items:['WOULD = 先退一步，再向前','WILL → 直接；WOULD → 有距离','WOULD LIKE → 柔化后的意愿','IF + WOULD → 假设世界与结果关系']} ]});</script></body></html>
