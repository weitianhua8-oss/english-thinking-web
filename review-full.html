<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语思维复习系统 · 完整三层版</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1e293b;background:linear-gradient(135deg,#f6f2ff,#f7f9ff 52%,#eef9ff)}.wrap{max-width:1080px;margin:auto;padding:28px 15px 110px}.hero{padding:8px 3px 16px}.hero h1{margin:0;font-size:clamp(42px,8vw,72px);line-height:1;letter-spacing:-.055em;background:linear-gradient(90deg,#8a63f5,#6878ef,#4da3e5);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:#748097;line-height:1.8;max-width:760px}.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#fff;border:1px solid #e8eaf5;font-size:12px;font-weight:800}.tools{position:sticky;top:0;z-index:50;display:flex;gap:8px;flex-wrap:wrap;padding:10px;margin:12px 0 18px;background:rgba(250,251,255,.88);backdrop-filter:blur(18px);border-radius:18px}input{flex:1;min-width:210px;height:44px;border:1px solid #e1e6ef;border-radius:13px;padding:0 14px;background:#fff}button,a.btn{border:1px solid #e1e6ef;border-radius:13px;background:#fff;color:#26324a;font-weight:780;padding:10px 13px;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.card{background:rgba(255,255,255,.91);border:1px solid rgba(255,255,255,.95);border-radius:24px;padding:20px;box-shadow:0 15px 38px rgba(74,87,143,.08)}.num{font-size:11px;font-weight:850;color:#6d6fad;padding:5px 9px;border-radius:999px;background:linear-gradient(90deg,#eee9ff,#eaf6ff)}.title{font-size:23px;font-weight:880;line-height:1.25;margin:12px 0}.layer-title{font-size:12px;color:#7667c8;font-weight:850;margin:12px 0 7px}.core{background:linear-gradient(110deg,#f0ecff,#ebf8ff);border:1px solid #e2e5f5;border-radius:17px;padding:14px 15px;font-weight:760;line-height:1.72}.visual{white-space:pre-wrap;margin-top:10px;background:#fbfcff;border:1px dashed #d6e1ef;border-radius:15px;padding:13px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.55;color:#4b5870}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.quickBtn{background:#eef6ff}.deepBtn{background:#f2edff}.panel{display:none;margin-top:12px}.panel.open{display:block}.learn-section{margin-top:10px;background:#fff;border:1px solid #e7ecf4;border-radius:16px;padding:14px}.learn-section h3{margin:0 0 10px;font-size:15px}.learn-section p,.learn-section li,.learn-section blockquote{font-size:13.5px;line-height:1.78;color:#58657c}.learn-section ul,.learn-section ol{padding-left:22px}.learn-section blockquote{margin:10px 0;padding:10px 12px;border-left:4px solid #9d8df4;background:#f8f6ff;border-radius:8px}.learn-section pre{white-space:pre-wrap;overflow:auto;background:#f8faff;border:1px solid #e6ebf3;border-radius:12px;padding:12px;font-size:12px;line-height:1.55}.learn-section code{font-family:ui-monospace,Menlo,monospace}.map{display:inline-flex;margin-top:12px;background:#111827!important;color:#fff!important;border:0!important}.source-note{font-size:11px;color:#8a94a8;margin-top:10px}.empty,.loading{grid-column:1/-1;text-align:center;padding:60px;color:#7d8798}.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:5px;padding:7px;border-radius:20px;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);box-shadow:0 13px 30px rgba(70,83,140,.14)}.nav button,.nav a{border:0;background:transparent;font-size:12px}.quiz{display:none;background:#fff;border:1px solid #e5eaf2;border-radius:22px;padding:18px;margin-bottom:16px}.quiz.open{display:block}@media(max-width:760px){.wrap{padding:22px 12px 105px}.grid{grid-template-columns:1fr}.hero h1{font-size:50px}.card{border-radius:21px}.nav{width:calc(100% - 16px);justify-content:space-around}}</style></head><body><div class="wrap"><header class="hero"><h1>英语思维<br>完整三层复习</h1><p><b>第一层</b>负责快速回忆；<b>第二层</b>从完整笔记提取核心画面、使用场景、高频结构和代表例句；<b>第三层</b>保留完整学习内容，不再压缩成摘要。</p><span id="badge" class="badge">正在载入完整学习内容…</span></header><div class="tools"><input id="q" placeholder="搜索 out / class / would / get..."><button onclick="showAll()">全部</button><button onclick="today()">今日 6 张</button><button onclick="random6()">随机 6 张</button><button onclick="quizOne()">主动回忆</button></div><div id="quiz" class="quiz"></div><main id="cards" class="grid"><div class="loading">正在载入 32 张完整知识卡…</div></main></div><div class="nav"><button onclick="showAll()">全部</button><button onclick="today()">今日</button><button onclick="random6()">随机</button><a class="btn" href="index.html">导图</a></div><script src="assets/review-full-1.js"></script><script src="assets/review-full-2.js"></script><script src="assets/review-full-3.js"></script><script src="assets/review-full-4.js"></script><script src="assets/review-full-5.js"></script><script src="assets/review-full-6.js"></script><script>let DATA=[];const cards=document.getElementById('cards'),q=document.getElementById('q'),quizBox=document.getElementById('quiz'),badge=document.getElementById('badge');function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}async function loadData(){try{const bin=atob(window.REVIEW_B64||'');const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('浏览器不支持解压缩');const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();DATA=JSON.parse(text);badge.textContent=DATA.length+' 张知识卡 · 深入学习为完整版';render(DATA)}catch(e){console.error(e);cards.innerHTML='<div class="empty">完整内容载入失败，请刷新页面或用最新版 Safari / Chrome 打开。</div>';badge.textContent='载入失败'}}function card(x){return `<article class="card"><span class="num">#${x.num}</span><div class="title">${esc(x.title)}</div><div class="layer-title">第一层｜3 秒复习</div><div class="core">${esc(x.core)}</div>${x.visual?`<div class="visual">${esc(x.visual)}</div>`:''}<div class="actions"><button class="quickBtn" onclick="togglePanel(this,'quick')">快速理解</button><button class="deepBtn" onclick="togglePanel(this,'deep')">深入学习</button></div><div class="panel quick"><div class="layer-title">第二层｜快速理解</div>${x.quick}</div><div class="panel deep"><div class="layer-title">第三层｜完整学习</div>${x.deep}${x.map?`<a class="btn map" href="${x.map}">打开完整思维导图 →</a>`:''}<div class="source-note">第三层来自当前完整学习母本；WOULD / LIKE 来自已保存的完整导图内容。</div></div></article>`}function render(list){cards.innerHTML=list.length?list.map(card).join(''):'<div class="empty">没有找到相关内容。</div>'}function togglePanel(btn,cls){const p=btn.closest('.card').querySelector('.'+cls);p.classList.toggle('open');btn.textContent=p.classList.contains('open')?(cls==='quick'?'收起快速理解':'收起深入学习'):(cls==='quick'?'快速理解':'深入学习')}function showAll(){quizBox.classList.remove('open');render(DATA)}function random6(){quizBox.classList.remove('open');render([...DATA].sort(()=>Math.random()-.5).slice(0,6))}function today(){quizBox.classList.remove('open');const start=(new Date().getDate()*7)%DATA.length,a=[];for(let i=0;i<6;i++)a.push(DATA[(start+i*5)%DATA.length]);render(a)}function quizOne(){const x=DATA[Math.floor(Math.random()*DATA.length)];quizBox.innerHTML=`<div class="title">${esc(x.token)}</div><p>先自己说出：核心画面 + 一句话本源。</p><button id="showAnswer">显示答案</button><div id="qa" class="panel"><div class="core">${esc(x.core)}</div>${x.visual?`<div class="visual">${esc(x.visual)}</div>`:''}</div>`;document.getElementById('showAnswer').onclick=()=>document.getElementById('qa').classList.toggle('open');quizBox.classList.add('open');window.scrollTo({top:0,behavior:'smooth'})}q.addEventListener('input',()=>{const s=q.value.toLowerCase();render(DATA.filter(x=>(x.title+' '+x.core).toLowerCase().includes(s)))});loadData();</script></body></html>
