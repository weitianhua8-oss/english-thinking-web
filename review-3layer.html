<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语思维三层复习系统</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1f2940;background:radial-gradient(850px 500px at 5% 5%,rgba(172,149,255,.28),transparent 62%),radial-gradient(900px 520px at 95% 7%,rgba(99,197,255,.27),transparent 64%),linear-gradient(125deg,#f8f3ff,#f6f8ff 50%,#effaff);background-attachment:fixed}.wrap{max-width:1120px;margin:auto;padding:28px 16px 112px}.hero h1{font-size:clamp(44px,8vw,76px);line-height:.98;letter-spacing:-.055em;margin:0;background:linear-gradient(90deg,#8b64f5,#6878ef 48%,#4da5e5);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:#748097;line-height:1.8}.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#fff9;border:1px solid #fff;font-size:12px;font-weight:800}.tools{position:sticky;top:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;margin:20px 0;padding:10px;border-radius:20px;background:#f9faffd9;backdrop-filter:blur(18px)}input{flex:1;min-width:210px;height:46px;border:1px solid #e3e8f2;border-radius:14px;padding:0 15px;background:#fff}button,a.btn{height:42px;border:1px solid #e3e8f2;border-radius:13px;padding:0 13px;background:#fff;color:#26314a;font-weight:780;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:#ffffffd9;border:1px solid #fff;border-radius:25px;padding:21px;box-shadow:0 16px 42px rgba(70,84,140,.09)}.num{font-size:11px;font-weight:850;color:#6f70ac;background:linear-gradient(90deg,#eee9ff,#eaf6ff);padding:5px 9px;border-radius:999px}.title{font-size:24px;font-weight:880;margin:12px 0}.label{font-size:12px;font-weight:850;color:#7467c8;margin:10px 0 7px}.core{padding:14px 15px;border-radius:17px;background:linear-gradient(110deg,#f0ecff,#eaf7ff);border:1px solid #e2e5f5;line-height:1.7;font-weight:760}.visual,.txt{white-space:pre-wrap;word-break:break-word}.visual{margin-top:10px;padding:13px;border:1px dashed #d7e1ef;border-radius:15px;background:#fbfcff;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.55;color:#4d5870}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{height:38px;font-size:12px}.fast{background:#edf5ff}.deep{background:#f2edff}.panel{display:none;margin-top:12px}.panel.open{display:block}.section{margin-top:9px;padding:13px;border:1px solid #e6ecf5;border-radius:16px;background:#fff}.section h3{margin:0 0 7px;font-size:14px}.txt{font-size:13px;line-height:1.72;color:#5d6980}.map{margin-top:11px;background:#111827!important;color:#fff!important;border:0!important}.empty{grid-column:1/-1;text-align:center;padding:60px;color:#7d8798}.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:5px;padding:7px;border-radius:21px;background:#ffffffdf;backdrop-filter:blur(18px);box-shadow:0 14px 34px rgba(70,83,140,.14)}.nav button,.nav a{border:0;background:transparent;height:39px;font-size:12px}.quiz{display:none;margin-bottom:18px;padding:18px;border-radius:22px;background:#fff;border:1px solid #e5eaf3}.quiz.open{display:block}.quiz strong{font-size:30px}@media(max-width:760px){.wrap{padding:22px 13px 105px}.grid{grid-template-columns:1fr}.hero h1{font-size:52px}.card{border-radius:22px}.nav{width:calc(100% - 16px);justify-content:space-around}}</style></head><body><div class="wrap"><header class="hero"><h1>英语思维<br>三层复习系统</h1><p>每一张卡都统一为：<b>3 秒复习 → 快速理解 → 深入学习</b>。随机抽到任何一张，都能继续点进第三层。</p><span class="badge">32 张知识卡 · 已全部统一</span></header><div class="tools"><input id="q" placeholder="搜索 out / class / would / get..."><button onclick="allCards()">全部</button><button onclick="today()">今日 6 张</button><button onclick="random6()">随机 6 张</button><button onclick="quiz()">主动回忆</button></div><div id="quiz" class="quiz"></div><main id="cards" class="grid"></main></div><div class="nav"><button onclick="allCards()">全部</button><button onclick="today()">今日</button><button onclick="random6()">随机</button><a class="btn" href="index.html">导图</a></div><script>const D=[
{t:'AT',c:'把地点、时间、目标或活动压缩成一个“点”来定位。',v:'大空间 / 时间轴 / 目标面 → 🎯 AT',q:'地点点：at the station；时间点：at 8:00；目标点：look at me；高频：at home / at work / good at。',d:'底层：点定位。意义生长：地点点→时间点→动作目标点→抽象项目点。对比：AT vs IN = 点视角 vs 容器视角；AT vs TO = 锁定点 vs 朝目标移动。避坑：AT 不是“小地方”。知识网络：AT→时间点/地点点/动作目标；与 IN、TO 构成空间关系系统。',m:'words/at.html'},
{t:'ON',c:'两个东西建立“接触 / 依附 / 承载”关系。',v:'● 物体 ↓ ━━━━━ 表面 = ON',q:'真实表面：book on the table；依附：picture on the wall；平台/媒介：on TV / on the phone；高频：turn on。',d:'底层：不是简单“在上面”，而是接触、依附、承载或连接。意义生长：物理接触→平台→运行/连接状态。对比：ON vs IN = 面关系 vs 容器关系；ON vs OFF = 接上 vs 脱开。避坑：ON 不要求“在上方”。知识网络：ON↔OFF。',m:'words/on.html'},
{t:'IN',c:'在某个边界、范围、系统或状态内部。',v:'┌──────┐\n│  ●   │ IN\n└──────┘',q:'真实空间：in the bag；时间范围：in 2026；状态：in trouble；系统：in English。',d:'底层：边界内部。意义生长：空间容器→时间范围→抽象系统→状态。对比：IN vs INTO = 已在内部 vs 跨边界进入；IN vs AT = 容器视角 vs 点定位。避坑：IN 不等于“大地方”。知识网络：IN↔OUT，IN+TO→INTO。',m:'words/in.html'},
{t:'TO',c:'从当前位置朝一个目标指过去。',v:'起点 ● ─────→ 🎯 目标',q:'go to school；give it to me；listen to me；want to go；lead to success。高频：go/come to、give/send to、listen/talk to、want/need to do。',d:'底层：目标箭头。意义生长：空间目标→接收目标→注意目标→动作目标→结果目标。对比：TO vs AT = 朝目标 vs 锁定点；TO vs INTO = 到目标 vs 跨边界进入。避坑：介词 to 与不定式 to 语法身份不同。知识网络：FROM→TO；IN+TO→INTO。',m:'words/to-xstyle.html'},
{t:'TOO...TO...',c:'程度超过合适界限，使后面的目标动作通常不可行。',v:'程度 ↑ ─ 临界线 ─ TOO → 🚫 TO DO',q:'too hot to drink；too heavy to carry；too good to miss。高频：too + adj + to do；too + adj + for sb + to do。',d:'底层：程度越界→目标受阻。意义生长：一般程度→越过阈值→后续动作受限。对比：VERY=程度高；TOO=高到过界。避坑：too...to... 并非机械等于“太……而不能”，语境可有正向表达如 too good to miss。知识网络：TOO + TO。'},
{t:'INTO',c:'朝内部推进，并跨过边界进入其中。',v:'外面 ● ─→ |边界| ─→ 📦 里面',q:'walk into the room；crash into a wall；turn into ice。高频：go/come/walk into；turn/change into。',d:'底层：方向 + 跨边界 + 内部结果。意义生长：空间进入→碰撞进入→状态/形态转化。对比：IN=内部关系；TO=目标箭头；INTO=跨边界进入。避坑：不要把 into 拆成所有场景下都能分别翻译的 in + to。知识网络：IN+TO→INTO。'},
{t:'OF',c:'用后面的名词去界定、组成或说明前面的名词。',v:'A ← 关系桥 → B   A of B',q:'a bottle of water；roof of the house；one of the students；a piece of cake。',d:'底层：名词—名词关系桥。意义生长：组成/内容→部分整体→数量群体→属性说明。对比：OF 与 ’s 都建关系，但习惯和视角不同。避坑：不要只背“……的”。知识网络：名词关系系统。'},
{t:'OFF',c:'从接触、连接、依附或运行轨道上脱离。',v:'ON：●━━━━  →  OFF：● ↗',q:'fall off the table；get off the bus；turn off the TV；take off。',d:'底层：脱开连接/接触/运行。意义生长：表面脱离→平台退出→运行切断→抽象脱开。对比：ON↔OFF；OUT 是脱离内部/系统，OFF 是脱离连接/接触。避坑：OFF 不只是“关”。知识网络：ON↔OFF。'},
{t:'WITH',c:'A 和 B 同时进入一个事件/场景，B 充当伴随角色。',v:'┌ 场景 ┐ A + B = WITH',q:'come with me；cut with a knife；girl with long hair；agree with me。',d:'底层：共同进入同一场景。意义生长：伴随→工具→特征→关系对象。对比：WITH 把工具带进场景；BY 强调通过方式/路径到结果。避坑：不要只背“和/用”。知识网络：伴随与工具关系系统。'},
{t:'BY',c:'某事通过一个旁侧、路径、方式、施动来源或界限发生。',v:'起点 ── by 路径/方式 ─→ 结果',q:'travel by train；send by email；written by her；by 5:00。',d:'底层：路径/方式/来源/界限。意义生长：空间旁侧→方式→施动来源→截止界限。对比：BY + 人常是施动来源；WITH + 工具把工具放进动作场景。避坑：不要把 BY 固定成“通过”。知识网络：方式/路径系统。'},
{t:'FOR',c:'某事物或动作面向受益者、目的、用途或覆盖范围。',v:'事物 / 动作 ═══▶ 🎯 FOR',q:'This is for you；go for a walk；for two hours；good for health。',d:'底层：朝某个受益、目的、用途或范围“面向”。意义生长：受益者→目的→用途→持续范围。对比：FOR vs TO = 面向/用途 vs 方向/转移。避坑：FOR 不等于“为了”。知识网络：方向与目的系统。'},
{t:'ABOUT',c:'信息、思考或动作围绕一个中心展开。',v:'○ ○  ●中心  ○ ○ = ABOUT',q:'talk about the problem；think about you；a book about space；about 10 people。',d:'底层：围绕中心。意义生长：话题围绕→思考围绕→内容主题→近似范围。对比：ABOUT 不是简单“关于”。避坑：不要把 on=深、about=浅当绝对规则。知识网络：主题与范围系统。'},
{t:'IF',c:'先打开一个条件世界，再看那个世界里的结果。',v:'现实 ├ IF成立 → 结果A └ 不成立 → 另一条路',q:'If it rains, we will stay home；If I had time, I would travel。',d:'底层：条件世界开关。意义生长：真实可能→假设世界→条件结果。对比：不同条件句主要差别在说话者如何看待现实距离。避坑：不要只按“如果”翻译。知识网络：IF 与 WOULD 的假设世界连接。'},
{t:'THE',c:'锁定说话双方能够识别的那个/那些对象。',v:'○ ○ ○ → 🔦 → ● THE',q:'the sun；the book on the table；open the door；the first time。',d:'底层：可定位性/共同识别。意义生长：唯一对象→上下文已知→限定后可定位→序数/最高级。对比：a/an 引入一个；the 锁定那个。避坑：THE 不等于中文“这个/那个”。知识网络：名词指称系统。'},
{t:'BE',c:'状态连接器：告诉我们主语处在什么身份、位置、性质或状态。',v:'主语 ─ BE ─→ 状态 / 身份 / 位置',q:'I am happy；She is a teacher；They are at home；The window is broken。',d:'底层：把主语连接到状态信息。意义生长：身份→性质→位置→状态→进行/被动等语法结构。对比：普通动词自带动作，BE 主要搭桥。避坑：BE 不等于“是”。知识网络：BE + -ING，BE + 过去分词。'},
{t:'-ING',c:'把动作从一个词“打开”，进入动作内部看过程或把它当成活动。',v:'READ → 🎬 reading（动作展开）',q:'I am reading；Reading is fun；I like reading；a sleeping baby。',d:'底层：动作内部/活动化。意义生长：进行过程→活动名词化→修饰状态。对比：to do 更像指向动作目标；doing 更像打开动作本身。避坑：-ING 不等于“正在”。知识网络：BE + -ING；LIKE + doing。'},
{t:'SEE / LOOK / WATCH',c:'SEE=画面进入眼睛；LOOK=主动转视线；WATCH=持续跟着变化。',v:'SEE 画面→👁️；LOOK 👁️→🎯；WATCH 👁️→🎬',q:'I see a bird；Look at the bird；Watch the bird fly。高频：look at；watch + 变化过程。',d:'底层：感知结果 / 主动启动 / 持续跟随三个镜头。对比：SEE vs LOOK vs WATCH。避坑：不要只背“看见/看/观看”。知识网络：与 HEAR/LISTEN 组成感官系统。'},
{t:'HEAR / LISTEN',c:'HEAR=声音进入听觉；LISTEN=主动把听觉注意力指向声音。',v:'HEAR 🔊→👂；LISTEN 👂→🎯声音',q:'I can hear music；Listen to me；listen to music。',d:'底层：感知结果 vs 主动注意。意义生长：收到声音→主动对准声音。对比：HEAR vs LISTEN；LISTEN 常与 TO 连接目标。避坑：不要只背“听见/听”。知识网络：SEE/LOOK/WATCH ↔ HEAR/LISTEN。'},
{t:'SAY / TELL / SPEAK / TALK',c:'SAY看内容；TELL看信息交给谁；SPEAK看语言表达；TALK看交流过程。',v:'SAY 💬；TELL 💬→👤；SPEAK 🗣️；TALK 🗣️↔🗣️',q:'say something；tell me the truth；speak English；talk to/with someone。',d:'底层：同一个“说”按信息结构分镜。对比：SAY 内容；TELL 接收者；SPEAK 语言/正式表达；TALK 双向交流。避坑：不要都翻译成“说”后死背搭配。知识网络：TELL 与 TO/接收方向，TALK TO 与沟通目标。'},
{t:'LOOK FOR / FIND',c:'LOOK FOR=寻找过程；FIND=目标已经进入“找到了”的结果状态。',v:'LOOK FOR 👁️→???→🎯；FIND ✅🎯',q:'look for my keys；find my keys；find out the truth。',d:'底层：过程 vs 结果。意义生长：注意力搜索→目标出现。对比：LOOK FOR 还没找到；FIND 已到结果。避坑：中文都可能说“找”，但英语分过程和结果。知识网络：FIND + OUT → 查明。'},
{t:'BRING / TAKE + COME / GO',c:'COME/BRING 朝参照点靠近；GO/TAKE 从参照点离开或朝别处去。',v:'COME/BRING → ★参照点；GO/TAKE ★→ 别处',q:'Come here；Go there；Bring it to me；Take it to him。',d:'底层：参照点决定方向。意义生长：人的移动→物体随人移动。对比：BRING vs TAKE、COME vs GO 都不是固定“来/去”，而是相对参照点。避坑：先找说话者/目的地参照点。知识网络：TO 负责目标箭头。'},
{t:'BORROW / LEND',c:'BORROW=东西朝借入者移动；LEND=东西从借出者朝别人移动。',v:'BORROW：别人📘→我；LEND：我📘→别人',q:'borrow a book from Tom；lend a book to Tom。',d:'底层：同一件物品，两条相反箭头。对比：BORROW 看接收方向；LEND 看给予方向。避坑：中文“借”一个字覆盖两个英语方向。知识网络：FROM / TO 与借贷方向连接。'},
{t:'STUDY / LEARN / TEACH',c:'STUDY=投入学习活动；LEARN=知识进入系统；TEACH=帮助知识进入别人系统。',v:'STUDY 我→📚；LEARN 📚→🧠；TEACH 🧠老师→🧠学生',q:'study English；learn English；teach English；learn to swim。',d:'底层：过程投入 / 获得结果 / 传递帮助。对比：STUDY 不保证学会；LEARN 不一定表示完全掌握；TEACH 是教学行为。避坑：不要把 study/learn 都翻成“学习”。知识网络：学习系统三角。'},
{t:'MAKE / DO',c:'MAKE 倾向产生结果；DO 倾向执行活动或任务。',v:'MAKE 行动→🎁结果；DO 🏃→活动/任务',q:'make a cake / decision / mistake；do homework / work / exercise。',d:'底层：结果焦点 vs 活动焦点，是高频倾向而非绝对规则。对比：MAKE 更像“做出”；DO 更像“做这件事”。避坑：不能靠中文“做”直接选词。知识网络：动作组织系统。'},
{t:'TAKE / GET',c:'TAKE=主动把某物带入自己的控制/路径；GET=到达获得、结果或状态点。',v:'TAKE 我🤲→📦；GET 当前位置→✅结果',q:'take the book；take a bus；get a gift；get home；get tired。',d:'底层：TAKE 看主动控制/带走；GET 看“抵达结果”。意义生长：获得→到达→状态变化。对比：TAKE vs GET。避坑：GET 不是十几个孤立中文义项。知识网络：GET 是结果/到达系统。'},
{t:'GIVE / GET + PUT / TAKE',c:'GIVE/GET 看所有权或获得方向；PUT/TAKE 看位置控制方向。',v:'GIVE 我📦→别人；GET 世界📦→我；PUT 📦→位置；TAKE 位置→📦',q:'give me a book；get a book；put it on the table；take it away。',d:'底层：四个基础箭头。对比：GIVE↔GET 是交付/获得；PUT↔TAKE 是放置/拿走。避坑：先看箭头方向，而不是背中文。知识网络：与 TO、FROM、ON、IN 等位置关系连接。'},
{t:'KNOW / UNDERSTAND + REMEMBER / FORGET',c:'KNOW=信息已在系统里；UNDERSTAND=关系连通；REMEMBER=还能提取；FORGET=提取连接失效。',v:'KNOW [信息]；UNDERSTAND A—B—C；REMEMBER 🧠→💡；FORGET 🧠 -x→💡',q:'know the answer；understand the idea；remember his name；forget the key。',d:'底层：信息存在、关系连通、提取成功、提取失败四个认知状态。对比：KNOW≠UNDERSTAND；REMEMBER≠KNOW。避坑：不要只背“知道/理解/记得/忘记”。知识网络：认知信息系统。'},
{t:'WAIT / STAY + STOP / FINISH',c:'WAIT=保持直到条件出现；STAY=持续留在状态；STOP=让过程停止；FINISH=推进到自然终点。',v:'WAIT ●…等待；STAY ●════；STOP ─■；FINISH ───✅',q:'wait for me；stay here；stop talking；finish the work。',d:'底层：保持/等待/终止/完成四种时间过程关系。对比：STOP 是中断；FINISH 是到达完成终点。WAIT 常等条件；STAY 只保持。避坑：停止不等于完成。知识网络：过程状态系统。'},
{t:'CLASS',c:'把具有共同特征的人或事物划进同一组 / 同一层级。',v:'很多人/物 → 共同标准 → [同一组] CLASS',q:'Our class has 30 students；English class；class of 2026；middle class；first class。高频：in class / have class。',d:'底层：分类/分组/层级化。意义生长：学生群体→课堂→届别→社会阶层→等级/类别。对比：CLASS≠CLASSROOM；LESSON=具体一课；COURSE=整套课程。避坑：不要把 class 只背成“班级/教室”。知识网络：CLASS→CLASSROOM / CLASSIFY；与 IN、AT 可组合。',m:'words/class-xstyle.html'},
{t:'OUT',c:'从某个里面、边界、系统或状态中脱离出来。',v:'IN：[ ● ]   OUT：[   ] ─────→ ●',q:'go out；take out；come out；find out；run out of；out of stock；lights are out。',d:'底层：从内部/范围/系统/状态脱离。意义生长：空间出去→拿出→显现→信息揭开→资源耗尽→运行停止。对比：IN↔OUT；OUT vs OFF=脱离内部 vs 脱离连接；OUT vs OUTSIDE=出去/脱离 vs 外部位置。避坑：find out 等固定搭配理解后整体记。知识网络：OUT OF / RUN OUT OF / FIND OUT。',m:'words/out-xstyle.html'},
{t:'WOULD',c:'把现实往后退一步，再从那个“较远的世界”里看动作、意愿或结果。',v:'WILL →；WOULD ↘ 再 →',q:'He said he would go；If I had time, I would travel；Would you help me?；I would like some coffee；过去反复动作。',d:'底层：距离感。距离可以来自过去时间、假设世界、社交礼貌或柔和意愿。对比：WILL 更直接贴近现实；WOULD 拉远一点再向前。避坑：不要只背“will 的过去式”。知识网络：future-in-the-past / hypothetical / politeness / would like / past habit。',m:'words/would.html'},
{t:'LIKE',c:'两个高频核心：① 正向偏好；② A ≈ B 的相似关系。',v:'喜欢：对象 → 我 😊；相似：A ≈ B',q:'I like dogs；like doing / like to do；would like；look like；sound like；What is she like?。',d:'底层：动词 LIKE 的偏好系统，与相似 LIKE 的关系系统不要硬合并。意义生长：偏好→活动偏好→柔和意愿；相似→外观/声音/特征。对比：LIKE vs LOVE；LIKE vs AS。避坑：What is she like? 不是“她喜欢什么”。知识网络：WOULD + LIKE；look/sound/feel + like。',m:'words/like.html'}];
function e(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(x,i){return `<article class="card"><span class="num">#${i+1}</span><div class="title">${e(x.t)}</div><div class="label">第一层｜3 秒复习</div><div class="core">${e(x.c)}</div><div class="visual">${e(x.v)}</div><div class="actions"><button class="fast" onclick="tog(this,'f')">快速理解</button><button class="deep" onclick="tog(this,'d')">深入学习</button></div><div class="panel f"><div class="label">第二层｜快速理解</div><div class="section"><h3>🎯 场景 · 高频结构 · 例句</h3><div class="txt">${e(x.q)}</div></div></div><div class="panel d"><div class="label">第三层｜深入学习</div><div class="section"><h3>🧠 底层思维 · 意义生长 · 对比 · 避坑 · 知识网络</h3><div class="txt">${e(x.d)}</div></div>${x.m?`<a class="btn map" href="${x.m}">打开完整思维导图 →</a>`:''}</div></article>`}function render(a){cards.innerHTML=a.length?a.map((x,i)=>card(x,i)).join(''):'<div class="empty">没有找到相关卡片。</div>'}function tog(b,c){let p=b.closest('.card').querySelector('.'+c);p.classList.toggle('open');b.textContent=p.classList.contains('open')?(c==='f'?'收起快速理解':'收起深入学习'):(c==='f'?'快速理解':'深入学习')}function allCards(){quizBox.classList.remove('open');render(D)}function random6(){quizBox.classList.remove('open');render([...D].sort(()=>Math.random()-.5).slice(0,6))}function today(){quizBox.classList.remove('open');let s=(new Date().getDate()*7)%D.length,a=[];for(let i=0;i<6;i++)a.push(D[(s+i*5)%D.length]);render(a)}function quiz(){let x=D[Math.floor(Math.random()*D.length)];quizBox.innerHTML=`<strong>${e(x.t)}</strong><p>先说出核心画面和一句话本源。</p><button onclick="this.nextElementSibling.classList.toggle('open')">显示答案</button><div class="panel"><div class="core">${e(x.c)}</div><div class="visual">${e(x.v)}</div><button onclick="render([D.find(v=>v.t===${JSON.stringify('X')})])" style="display:none"></button></div>`;let p=quizBox.querySelector('.panel');quizBox.querySelector('button').onclick=()=>p.classList.toggle('open');quizBox.classList.add('open');window.scrollTo({top:0,behavior:'smooth'})}const cards=document.getElementById('cards'),q=document.getElementById('q'),quizBox=document.getElementById('quiz');q.addEventListener('input',()=>{let s=q.value.toLowerCase();render(D.filter(x=>(x.t+' '+x.c+' '+x.q+' '+x.d).toLowerCase().includes(s)))});render(D);</script></body></html>
