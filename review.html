<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语思维复习系统</title><style>:root{--ink:#172033;--muted:#748097;--line:#e6ebf5;--glass:rgba(255,255,255,.84)}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(900px 500px at 8% 6%,rgba(173,157,255,.30),transparent 62%),radial-gradient(900px 520px at 90% 9%,rgba(123,205,255,.30),transparent 64%),linear-gradient(120deg,#f6f0ff,#f5f7ff 48%,#eef9ff);background-attachment:fixed}.wrap{max-width:1100px;margin:auto;padding:34px 18px 110px}.hero{margin:10px 0 24px}.hero h1{margin:0;font-size:clamp(42px,8vw,78px);letter-spacing:-.055em;line-height:1}.grad{background:linear-gradient(90deg,#8a63f5,#6678ef 48%,#4da1e4);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{margin:18px 0 0;color:var(--muted);line-height:1.8}.tools{display:flex;gap:9px;flex-wrap:wrap;padding:10px;background:rgba(255,255,255,.54);border-radius:20px;margin:20px 0}input{flex:1;min-width:220px;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 15px;background:#fff}button,a.btn{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;font-weight:760;color:var(--ink);text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--glass);border:1px solid rgba(255,255,255,.92);border-radius:25px;padding:21px;box-shadow:0 16px 42px rgba(74,91,150,.09);backdrop-filter:blur(16px)}.num{display:inline-flex;padding:5px 9px;border-radius:999px;background:linear-gradient(90deg,#eee9ff,#eaf6ff);font-size:12px;font-weight:800;color:#6b6eb3}.title{font-size:25px;font-weight:850;letter-spacing:-.03em;margin:12px 0}.core{background:linear-gradient(110deg,#f0ecff,#ebf8ff);border:1px solid #e1e5f6;border-radius:17px;padding:14px 15px;font-size:16px;line-height:1.75;font-weight:740}.visual{white-space:pre-wrap;background:#f9fbff;border:1px dashed #d8e2f1;border-radius:16px;padding:14px;margin-top:11px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6;color:#43506a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.detail{display:none;margin-top:13px}.detail.open{display:block}.sec{margin-top:10px;padding:13px;border:1px solid #e6ecf5;border-radius:16px;background:rgba(255,255,255,.8)}.sec h3{margin:0 0 8px;font-size:14px}.sec p,.sec li{font-size:13.5px;line-height:1.75;color:#5e6b84}.sec ul{margin:5px 0 0;padding-left:20px}.maplink{display:inline-flex;margin-top:10px;padding:9px 12px;border-radius:12px;background:#111827;color:#fff;text-decoration:none;font-weight:750;font-size:13px}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:8px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.94);border-radius:22px;backdrop-filter:blur(20px);box-shadow:0 16px 38px rgba(79,93,152,.14)}.nav button{border:0;background:transparent}.empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:24px 14px 110px}.hero h1{font-size:54px}.nav{width:calc(100% - 18px);justify-content:space-around}.card{border-radius:22px}}</style></head><body><div class="wrap"><div class="hero"><h1><span class="grad">英语思维</span><br>复习系统</h1><p>先主动回忆核心画面，再看答案。日常复习以网页为主；需要深挖时再回完整笔记。</p></div><div class="tools"><input id="q" placeholder="搜索 at / on / get / would / class..."><button onclick="showAll()">全部</button><button onclick="today()">今日 6 张</button><button onclick="random6()">随机 6 张</button><button onclick="quiz()">小测验</button></div><div id="cards" class="grid"></div></div><div class="nav"><button onclick="showAll()">全部</button><button onclick="today()">今日复习</button><button onclick="quiz()">小测验</button><a class="btn" href="index.html">知识导图</a></div><script>const DATA=[{"num":3,"title":"AT：把世界压缩成一个“点” 🎯","core":"AT = 把一个地点、时间、目标或活动，压缩成一个“点”来定位。","visual":"大空间 / 时间轴 / 目标面\n          ↓\n         🎯\n        AT","map":"words/at.html"},{"num":4,"title":"ON：接触 / 依附 / 承载在一个“面”上","core":"ON = 两个东西建立“接触 / 依附 / 承载”关系。","visual":"   ● 物体\n   ↓\n━━━━━━ 表面\n   ON","map":"words/on.html"},{"num":5,"title":"IN：在某个边界 / 范围 / 系统之内","core":"IN = 在某个边界、范围、系统或状态内部。","visual":"┌─────────┐\n│    ●    │\n│   IN    │\n└─────────┘","map":"words/in.html"},{"num":6,"title":"TO：朝目标伸出去的一支箭头","core":"TO = 从当前位置朝一个目标指过去。","visual":"起点 ● ─────────→ 🎯 目标\n              TO","map":"words/to-xstyle.html"},{"num":7,"title":"TOO...TO...：程度越界，目标路径被挡住","core":"TOO...TO... = 前面的程度超过合适界限，使后面的目标动作通常不可行。","visual":"程度 ↑\n───── 临界线\n     TOO（过界）\n     ↓\n     🚫 ─────→ TO DO"},{"num":8,"title":"INTO：箭头跨过边界，进入内部 / 新状态","core":"INTO = 朝内部推进，并跨过边界进入其中。","visual":"外面 ● ─────→ | 边界 | ─────→ 📦 里面\n                         INTO"},{"num":9,"title":"OF：给两个名词搭一座“关系桥”","core":"OF = 用后面的名词去界定、组成或说明前面的名词。","visual":"A ←──── 关系 ──── B\n     A of B"},{"num":10,"title":"OFF：从原来的连接 / 接触上脱开","core":"OFF = 从接触、连接、依附或运行轨道上脱离。","visual":"原来：●━━━━ 表面/连接\n后来：● ↗\n      OFF"},{"num":11,"title":"WITH：把两个东西放进同一个场景","core":"WITH = A 和 B 同时进入一个事件/场景，B 充当伴随角色。","visual":"┌──────── 场景 ────────┐\n│  A        +       B   │\n└──────────────────────┘\n          WITH"},{"num":12,"title":"BY：沿着某条路径 / 方式到达结果","core":"BY = 某事通过一个旁侧、路径、方式、施动来源或界限发生。","visual":"起点 ───── by 某路径 ─────→ 结果"},{"num":13,"title":"FOR：面向一个人、目的、用途或范围","core":"FOR = 某事物/动作是面向某个受益者、目的、用途或覆盖范围的。","visual":"事物 / 动作 ═══════▶ 🎯\n             FOR"},{"num":14,"title":"ABOUT：围绕一个中心展开","core":"ABOUT = 信息、思考或动作围绕一个中心展开。","visual":"○ ○\n  ○   ●   ○\n     ○ ○\n     ABOUT"},{"num":15,"title":"IF：打开一条“条件世界”分支","core":"IF = 先打开一个条件世界，再看那个世界里的结果。","visual":"现实世界\n  ├── IF 条件成立 ──→ 结果 A\n  └── 条件不成立 ──→ 另一条路"},{"num":16,"title":"THE：给可定位对象打一束聚光灯","core":"THE = 锁定说话双方能够识别的那个/那些对象。","visual":"○  ○  ○  ○\n     🔦\n     ↓\n     ●\n    THE"},{"num":17,"title":"BE：把主语连接到一个状态 / 坐标","core":"BE = 状态连接器：告诉我们主语处在什么身份、位置、性质或状态。","visual":"主语 ───── BE ─────▶ 状态 / 身份 / 位置\n I        am          happy"},{"num":18,"title":"-ING：把动作打开，看见内部过程 / 活动","core":"-ING = 把动作从一个词“打开”，让我们进入动作内部看过程或把它当成活动。","visual":"READ（动作标签）\n       ↓ 加 -ING\n🎬 reading ─────────\n  动作被展开"},{"num":19,"title":"SEE / LOOK / WATCH：同一个“看”，三个镜头","core":"SEE = 画面进入眼睛；LOOK = 主动把视线转过去；WATCH = 视线持续跟着变化。","visual":"SEE    画面 ─────→ 👁️\nLOOK   👁️ ─────→ 🎯\nWATCH  👁️ ─────→ 🎬"},{"num":20,"title":"HEAR / LISTEN：收到声音 vs 主动把耳朵转过去","core":"HEAR = 声音进入听觉；LISTEN = 主动把听觉注意力指向声音。","visual":"HEAR     🔊 ─────→ 👂\nLISTEN   👂 ─────→ 🎯声音"},{"num":21,"title":"SAY / TELL / SPEAK / TALK：四种“说”的组织方式","core":"SAY 聚焦内容；TELL 聚焦信息交给谁；SPEAK 聚焦语言表达；TALK 聚焦交流过程。","visual":"SAY   💬内容\nTELL  💬 ─────→ 👤\nSPEAK 🗣️ 语言/发言\nTALK  🗣️ ↔ 🗣️"},{"num":22,"title":"LOOK FOR / FIND：寻找过程 vs 找到结果","core":"LOOK FOR = 把注意力用于寻找目标；FIND = 目标已经进入结果状态——找到了。","visual":"LOOK FOR：👁️ ─────→ ? ? ? ─────→ 🎯\nFIND：✅ 🎯"},{"num":23,"title":"BRING / TAKE 与 COME / GO：关键是“参照点”","core":"COME / BRING = 朝参照点靠近；GO / TAKE = 从参照点离开或朝别处去。","visual":"参照点 ★\nCOME   ● ─────→ ★\nGO     ★ ─────→ ●\nBRING  📦 ─────→ ★\nTAKE   ★ ─────→ 📦"},{"num":24,"title":"BORROW / LEND：同一件物品，两条相反箭头","core":"BORROW = 东西朝我/借入者移动；LEND = 东西从我/借出者朝别人移动。","visual":"BORROW：别人 📘 ─────→ 我\nLEND：我 📘 ─────→ 别人"},{"num":25,"title":"STUDY / LEARN 与 TEACH / LEARN：过程、获得与传递","core":"STUDY = 投入学习活动；LEARN = 知识/技能进入你的系统；TEACH = 帮助知识/技能进入别人的系统。","visual":"STUDY 我 ───努力──→ 📚\nLEARN 📚 ─────→ 🧠我\nTEACH 🧠老师 ─────→ 🧠学生"},{"num":26,"title":"MAKE / DO：做出一个结果 vs 执行一个活动","core":"MAKE 倾向把注意力放在产生的结果；DO 倾向把注意力放在执行的活动/任务。","visual":"MAKE：材料/行动 ─────→ 🎁 结果\nDO：🏃 ───────── 进行活动/任务"},{"num":27,"title":"TAKE / GET：主动拿走 vs 到手 / 到达 / 变化","core":"TAKE = 主体主动把某物带入自己的控制/路径；GET = 到达一个结果、状态或获得点。","visual":"TAKE：我 🤲 ───→ 📦\nGET：当前位置 ─────→ ✅ 到手/到达/变成"},{"num":28,"title":"GIVE / GET、PUT / TAKE：用箭头看四个基础动作","core":"GIVE / GET 看“所有权/获得方向”；PUT / TAKE 看“位置控制方向”。","visual":"GIVE 我 📦 ─────→ 别人\nGET 世界 📦 ─────→ 我\nPUT 我把 📦 ─────→ 某位置\nTAKE 我从位置 🤲📦 ─────→ 带走"},{"num":29,"title":"KNOW / UNDERSTAND、REMEMBER / FORGET：知识进入、连接、保留与脱落","core":"KNOW = 信息已在认知系统里；UNDERSTAND = 信息之间的关系被连通；REMEMBER = 信息仍可被提取；FORGET = 提取连接失效。","visual":"KNOW 🧠[信息已存在]\nUNDERSTAND 🧠[A]──[B]──[C]\nREMEMBER 🧠 ─────→ 💡\nFORGET 🧠 - - -x→ 💡"},{"num":30,"title":"WAIT / STAY、STOP / FINISH：保持、等待、终止与完成","core":"WAIT = 保持当前位置/状态直到某条件出现；STAY = 持续留在某状态；STOP = 让过程停止；FINISH = 把过程推进到自然终点。","visual":"WAIT ● ─────……等待……\nSTAY ●════════ 保持\nSTOP ─────────■\nFINISH ─────────────✅"},{"num":31,"title":"WOULD：先离现实远一步，再向前看 ↘→","core":"WOULD = 把视角从眼前现实拉远一点，再去表达过去视角、假设结果、礼貌请求、柔和意愿或过去反复动作。","visual":"现实 ●\n     \\\n      ○ ─────→ 动作 / 意愿 / 结果\n       WOULD","map":"words/would.html"},{"num":32,"title":"CLASS：共同标准 → 分到同一组 / 同一层级","core":"CLASS = 把具有共同特征的人或事物，划进同一组 / 同一层级。","visual":"很多人 / 物\n     ↓\n 共同标准\n     ↓\n┌───────────┐\n│ 同一组 / 类 │\n│   CLASS    │\n└───────────┘","map":"words/class-xstyle.html","detail":{"thinking":"class 的底层不是“教室”，而是分类 / 分组 / 层级化。学校里的班级、课堂活动、毕业届别、社会阶层、等级和类别，背后都保留了“共同标准 → 归组 / 分层”的结构。","growth":["学生群体 → Our class has 30 students.","课堂活动 → I have an English class today.","毕业届别 → the class of 2026","社会阶层 → the middle class","等级 → first class","类别 → a class of animals"],"contrast":["CLASS ≠ CLASSROOM：class 是组 / 课 / 类；classroom 是上课的房间。","CLASS vs LESSON：lesson 更聚焦一次具体教学内容。","CLASS vs COURSE：course 是一整套持续一段时间的课程。","CLASS vs GROUP：group 更泛，不一定带正式分类标准。"],"patterns":["in class：在上课 / 课堂状态中","have class：有课 / 上课","English / math class：某学科课程","the class of + 年份：某届毕业生","middle / working / upper class：社会阶层"],"examples":["Our class is very friendly.","I have a math class at 10.","Please be quiet in class.","She graduated with the class of 2026.","They flew first class."]}}];function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function detailHtml(x){if(!x.detail)return '<div class="sec"><h3>复习提示</h3><p>先只看词名，自己说出核心画面；答不出来再回看上面的核心句。</p></div>';const d=x.detail;return `<div class="sec"><h3>🧠 底层英语思维</h3><p>${esc(d.thinking)}</p></div><div class="sec"><h3>🌱 意义生长</h3><ul>${d.growth.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><div class="sec"><h3>🆚 易混对比</h3><ul>${d.contrast.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><div class="sec"><h3>⚡ 高频结构</h3><ul>${d.patterns.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><div class="sec"><h3>📝 代表例句</h3><ul>${d.examples.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div>`}function card(x){return `<article class="card"><span class="num">${x.num}</span><div class="title">${esc(x.title)}</div><div class="core">${esc(x.core)}</div><div class="visual">${esc(x.visual)}</div><div class="actions"><button onclick="toggle(this)">展开复习</button>${x.map?`<a class="btn" href="${x.map}">完整导图</a>`:''}</div><div class="detail">${detailHtml(x)}${x.map?`<a class="maplink" href="${x.map}">打开 XSTYLE 完整思维导图 →</a>`:''}</div></article>`}function render(list){cards.innerHTML=list.length?list.map(card).join(''):'<div class="empty">没有找到相关词。</div>'}function toggle(btn){const d=btn.closest('.card').querySelector('.detail');d.classList.toggle('open');btn.textContent=d.classList.contains('open')?'收起':'展开复习'}function showAll(){render(DATA)}function random6(){render([...DATA].sort(()=>Math.random()-.5).slice(0,6))}function today(){const n=DATA.length,s=(new Date().getDate()*7)%Math.max(1,n-6);render(DATA.slice(s,s+6))}function quiz(){const x=DATA[Math.floor(Math.random()*DATA.length)];alert('先在脑中说出核心画面：\n'+x.title.split('：')[0]+'\n\n答案：\n'+x.core+'\n\n'+x.visual)}q.addEventListener('input',e=>{const t=e.target.value.toLowerCase();render(DATA.filter(x=>(x.title+' '+x.core).toLowerCase().includes(t)))});render(DATA);</script></body></html>
